{% extends 'base.html' %}
{% block title %}Reset Password - NaijaMarket{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #003319 0%, #006633 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-key fs-1 text-success"></i>
                            <h3 class="fw-bold mt-3">Forgot Password?</h3>
                            <p class="text-muted">Enter your email to reset your password</p>
                        </div>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Send Reset Link</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="{% url 'accounts:login' %}">
                                <i class="bi bi-arrow-left"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
