{% extends 'base.html' %}
{% block title %}Password Reset Complete - NaijaMarket{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #003319 0%, #006633 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-check-circle fs-1 text-success"></i>
                        <h3 class="fw-bold mt-3">Password Reset Complete!</h3>
                        <p class="text-muted">
                            Your password has been successfully reset. You can now login with your new password.
                        </p>
                        <a href="{% url 'accounts:login' %}" class="btn btn-success">Login Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
