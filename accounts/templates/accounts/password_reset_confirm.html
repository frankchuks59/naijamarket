{% extends 'base.html' %}
{% block title %}New Password - NaijaMarket{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #003319 0%, #006633 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <h3 class="fw-bold mb-4">Set New Password</h3>

                        <form method="POST">
                            {% csrf_token %}
                            {{ form.new_password1.label_tag }}
                            {{ form.new_password1 }}
                            {{ form.new_password2.label_tag }}
                            {{ form.new_password2 }}
                            <button type="submit" class="btn btn-success w-100 mt-3">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
