{% extends 'base.html' %}
{% block title %}Check Your Email - NaijaMarket{% endblock %}

{% block content %}
<section class="py-5" style="background: linear-gradient(135deg, #003319 0%, #006633 100%); min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-envelope-check fs-1 text-success"></i>
                        <h3 class="fw-bold mt-3">Check Your Email</h3>
                        <p class="text-muted">
                            We've sent a password reset link to your email address.
                        </p>
                        <a href="{% url 'accounts:login' %}" class="btn btn-outline-success">
                            Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
