{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Product - NaijaMarket{% endblock %}

{% block content %}
<nav class="navbar navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> NaijaMarket
        </a>
        <div>
            <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-light">Back to Dashboard</a>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-5 text-center">
                        <i class="bi bi-exclamation-triangle display-1 text-warning mb-3"></i>
                        <h3 class="fw-bold mb-3">Delete Product?</h3>
                        <p class="text-muted mb-4">
                            Are you sure you want to delete <strong>"{{ product.name }}"</strong>?
                            This action cannot be undone.
                        </p>

                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex gap-2 justify-content-center">
                                <button type="submit" class="btn btn-danger btn-lg px-4">
                                    <i class="bi bi-trash"></i> Yes, Delete
                                </button>
                                <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-secondary btn-lg px-4">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
